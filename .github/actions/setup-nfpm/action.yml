name: "Setup nfpm"
description: "Installs nfpm, which builds the .deb."

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.27.4
        cache: false

    - name: Install nfpm
      shell: bash
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
